output * pos 0 0

workspace_layout tabbed

# Whenever a display is plugged in or out, set the internal display resolution to match the physical display resolution if any exist
exec sh -c 'while swaymsg -qt subscribe "[\"output\"]" ; do $(swaymsg -t get_outputs | jq -r -e ".[] | select(.name != \"HEADLESS-1\") | .current_mode | \"swaymsg -q output HEADLESS-1 mode \" +(.width|tostring) + \"x\" + (.height|tostring)") ; done'

unbindsym $mod+1
unbindsym $mod+2
unbindsym $mod+3
unbindsym $mod+4
unbindsym $mod+5
unbindsym $mod+6
unbindsym $mod+7
unbindsym $mod+8
unbindsym $mod+9
unbindsym $mod+0

unbindsym $mod+Shift+1
unbindsym $mod+Shift+2
unbindsym $mod+Shift+3
unbindsym $mod+Shift+4
unbindsym $mod+Shift+5
unbindsym $mod+Shift+6
unbindsym $mod+Shift+7
unbindsym $mod+Shift+8
unbindsym $mod+Shift+9
unbindsym $mod+Shift+0

exec sleep 3 && swaymsg create_output HEADLESS-1
