output * pos 0 0

# Whenever a display is plugged in or out, set the internal display resolution to match the physical display resolution if any exist
exec sh -c 'while swaymsg -qt subscribe "[\"output\"]" ; do $(swaymsg -t get_outputs | jq -r -e ".[] | select(.name != \"HEADLESS-1\") | .current_mode | \"swaymsg -q output HEADLESS-1 mode \" +(.width|tostring) + \"x\" + (.height|tostring)") ; done'

exec swaymsg create_output HEADLESS-1
